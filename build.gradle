plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7.38'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files

    exclude("src/generated/**/.cache") // datagen cache files
}

// Private inputs remain outside versioned resources. Neither current profile is
// an approved public release; source-only also lacks required runtime motions.
def bundledMotionDirectory = providers.gradleProperty('bundleMotionDirectory')
def releaseProfile = bundledMotionDirectory.isPresent() ? 'local-preview' : 'source-only'
def releaseNotices = ['LICENSE', 'THIRD_PARTY_ASSETS.md', 'THIRD_PARTY_NOTICES.md']
def privateMotionOutputs = [layout.buildDirectory.dir('generated/bundledMotionResources'),
                            layout.buildDirectory.dir('resources/main/blacklight/bundled_motions')]
// Sync's empty-source handling is not a packaging boundary. Clear both generated
// and previously processed copies explicitly before a source-only resource build.
def clearPrivateMotionOutputs = tasks.register('clearPrivateMotionOutputs', Delete) {
    onlyIf { !bundledMotionDirectory.isPresent() }
    delete privateMotionOutputs
    doFirst {
        def buildRoot = layout.buildDirectory.get().asFile.toPath().toAbsolutePath().normalize()
        privateMotionOutputs.each { output ->
            def target = output.get().asFile.toPath().toAbsolutePath().normalize()
            if (target == buildRoot || !target.startsWith(buildRoot)) {
                throw new GradleException("Refusing to clear private staging outside build directory: ${target}")
            }
        }
    }
}
def stageBundledMotions = tasks.register('stageBundledMotions', Sync) {
    dependsOn clearPrivateMotionOutputs
    into layout.buildDirectory.dir('generated/bundledMotionResources')
    if (bundledMotionDirectory.isPresent()) {
        from(bundledMotionDirectory.get()) {
            into 'blacklight/bundled_motions'
            include '*.json', 'combat-motion-tuning.data', 'consume-placement.data', 'consume-receiver-events.data', 'receiver-poses.data', 'hunter-consume.data', 'hammer-scales.data', 'armor-growth.data', 'camera-profile.data', 'camera-events.data', 'camera-film.data', 'health-hud.data'
        }
        doFirst {
            def profile = file(bundledMotionDirectory.get())
            ['health-hud.data', 'camera-film.data', 'morph_claws.json', 'morph_blade.json', 'morph_hammerfists.json', 'morph_muscle_mass.json', 'morph_whipfist.json', 'morph_thermal_vision.json'].each {
                if (!new File(profile, it).isFile()) throw new GradleException("Incomplete cinematic motion profile: ${it}")
            }
            ['utility_shield_deploy.json', 'utility_shield_hit.json', 'utility_shield_run.json', 'utility_shield_sprint.json', 'utility_armor_transform.json', 'utility_armor_idle.json', 'basic_idle.json', 'basic_wall_top.json', 'basic_parkour_small.json', 'combat-motion-tuning.data', 'consume-placement.data', 'receiver-poses.data', 'hunter-consume.data', 'hammer-scales.data', 'armor-growth.data', 'camera-profile.data', 'camera-events.data'].each {
                if (!new File(profile, it).isFile()) throw new GradleException("Incomplete bundled motion profile: ${it}")
            }
        }
    }
}
sourceSets.main.resources.srcDir(stageBundledMotions)
tasks.named('processResources', ProcessResources).configure {
    dependsOn clearPrivateMotionOutputs
    inputs.property('blacklightReleaseProfile', releaseProfile)
    if (!bundledMotionDirectory.isPresent()) exclude 'blacklight/bundled_motions/**'
}

repositories {
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex('software\\.bernie.*')
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup('maven.modrinth')
        }
    }
}

base {
    archivesName = "${mod_archive_name}-MC${minecraft_version}-Forge"
}

// Forge requires the MixinExtras runtime that NeoForge supplies by default.
jarJar.enable()

// Keep both version numbers in every release; never hand-name the install ZIP.
def distributionZip = tasks.register('distributionZip', Zip) {
    group = 'distribution'
    description = 'Packages a local-preview or source-only candidate with notices; not a public release.'
    archiveBaseName = base.archivesName
    archiveVersion = project.version.toString()
    archiveClassifier = releaseProfile
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(tasks.named('jarJar')) { into 'mods' }
    from('README.md')
    from(releaseNotices)
    from('docs') { into 'docs' }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('assemble') { dependsOn(distributionZip) }
tasks.named('assemble') {
    description = 'Compiles and packages a candidate. Source-only lacks required runtime assets; neither profile is cleared for public release.'
}

// Minecraft 1.20.1 and Forge 47 target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Opt-in screenshot harness is excluded from normal builds and distributable JARs.
if (project.hasProperty('hiveFeedingTest')) {
    sourceSets.main.java.srcDir('src/hiveTest/java')
    sourceSets.main.resources.srcDir('src/traversalTest/resources')
}
if (project.hasProperty('wallTraversalTest')) {
    sourceSets.main.java.srcDir('src/traversalTest/java')
    sourceSets.main.resources.srcDir('src/traversalTest/resources')
}
if (project.hasProperty('standaloneVisual') || project.hasProperty('standaloneGait') || project.hasProperty('standaloneLock')) {
    sourceSets.main.java.srcDir('src/standaloneVisualTest/java')
}
if (project.hasProperty('standaloneTest')) {
    sourceSets.main.java.srcDir('src/standaloneTest/java')
    if (!project.hasProperty('wallTraversalTest') && !project.hasProperty('hiveFeedingTest')) {
        sourceSets.main.resources.srcDir('src/traversalTest/resources')
    }
}
tasks.withType(Jar).configureEach {
    archiveClassifier = releaseProfile
    from(releaseNotices)
    manifest.attributes('MixinConfigs': 'blacklight.mixins.json',
            'Blacklight-Build-Profile': releaseProfile,
            'Blacklight-Private-Assets': bundledMotionDirectory.isPresent().toString(),
            'Blacklight-Public-Release-Ready': 'false',
            'Blacklight-Asset-Notice': 'THIRD_PARTY_ASSETS.md')
    // Even if stale generated resources exist or tasks are skipped, source-only
    // artifacts cannot acquire the private namespace from an earlier local build.
    if (!bundledMotionDirectory.isPresent()) exclude 'blacklight/bundled_motions/**'
    exclude 'com/codex/blacklight/gametest/**'
    exclude 'com/codex/blacklight/client/Standalone*Smoke*.class'
    exclude 'data/blacklight/structures/wall_test.nbt'
}

minecraft {
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', mod_id
            if (project.hasProperty('localWeaponMotions'))
                property 'blacklight.localWeaponMotions', file(project.property('localWeaponMotions')).absolutePath
            mods {
                "${mod_id}" { source sourceSets.main }
            }
        }
        client {
            if (project.hasProperty('clientRunDirectory')) workingDirectory file(project.property('clientRunDirectory'))
            jvmArgs '-Xmx3G'
            if (project.hasProperty('quickPlayWorld')) args '--quickPlaySingleplayer', project.property('quickPlayWorld').toString()
            if (project.hasProperty('openAnimationTuner')) property 'blacklight.test.openAnimationTuner', 'true'
            ['standaloneVisual', 'standaloneGait', 'standaloneLock'].each { hook ->
                if (project.hasProperty(hook)) property "blacklight.test.${hook}", file(project.property(hook)).absolutePath
            }
            if (project.hasProperty('standaloneVisualShots')) property 'blacklight.test.standaloneVisual.shots', project.property('standaloneVisualShots').toString()
            if (project.hasProperty('standaloneGaitJump')) property 'blacklight.test.standaloneGait.jumpOnly', 'true'
        }
        server { args '--nogui' }
        gameTestServer {
            workingDirectory project.file('run-standalone-gametest')
            jvmArgs '-Xmx2G'
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }
    }
}
mixin {
    add sourceSets.main, 'blacklight.refmap.json'
    config 'blacklight.mixins.json'
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.4.1'))
    implementation(jarJar('io.github.llamalad7:mixinextras-forge:0.4.1')) {
        jarJar.ranged(it, '[0.4.1,)')
        jarJar.pin(it, '0.4.1')
    }

    // Optional compatibility API only. The user installs the two mods independently.
    compileOnly fg.deobf("maven.modrinth:parcool:${minecraft_version}-3.4.3.3")

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // BlacklightState exposes a Minecraft Codec; plain JVM tests therefore need DFU too.
    testImplementation 'com.mojang:datafixerupper:6.0.8'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.joml:joml:1.10.5'
    testImplementation files(sourceSets.main.compileClasspath)
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

def forgeTestClasses = layout.buildDirectory.dir('forge-test-classes')
def forgeTestRuntime = files(forgeTestClasses, sourceSets.test.runtimeClasspath)
def prepareForgeCapabilityTests = tasks.register('prepareForgeCapabilityTests') {
    dependsOn tasks.named('compileJava')
    inputs.files(sourceSets.main.output.classesDirs, sourceSets.main.compileClasspath)
    outputs.dir(forgeTestClasses)
    doLast {
        // Use Forge's real launch transformer, rather than replacing capabilities with mocks.
        def urls = files(sourceSets.main.output.classesDirs, sourceSets.main.compileClasspath).files.collect {
            it.toURI().toURL()
        } as URL[]
        def loader = new URLClassLoader(urls, ClassLoader.getPlatformClassLoader())
        try {
            def nodeClass = loader.loadClass('org.objectweb.asm.tree.ClassNode')
            def readerClass = loader.loadClass('org.objectweb.asm.ClassReader')
            def writerClass = loader.loadClass('org.objectweb.asm.ClassWriter')
            def visitorClass = loader.loadClass('org.objectweb.asm.ClassVisitor')
            def typeClass = loader.loadClass('org.objectweb.asm.Type')
            def phaseClass = loader.loadClass('cpw.mods.modlauncher.serviceapi.ILaunchPluginService$Phase')
            def transformer = loader.loadClass('net.minecraftforge.fml.common.asm.CapabilityTokenSubclass').getConstructor().newInstance()
            def transform = transformer.class.getMethod('processClassWithFlags', phaseClass, nodeClass, typeClass, String.class)
            ['net/minecraftforge/common/capabilities/CapabilityToken',
             'com/codex/blacklight/forge/BlacklightAttachments$1'].each { name ->
                byte[] original = loader.getResourceAsStream("${name}.class").withCloseable { it.readAllBytes() }
                def node = nodeClass.getConstructor().newInstance()
                readerClass.getConstructor(byte[].class).newInstance([original] as Object[]).accept(node, 0)
                transform.invoke(transformer, phaseClass.getField('BEFORE').get(null), node,
                        typeClass.getMethod('getObjectType', String.class).invoke(null, name), 'blacklight-junit')
                def writer = writerClass.getConstructor(int.class).newInstance(1)
                nodeClass.getMethod('accept', visitorClass).invoke(node, writer)
                def target = new File(forgeTestClasses.get().asFile, "${name}.class")
                target.parentFile.mkdirs()
                target.bytes = writer.toByteArray()
            }
        } finally {
            loader.close()
        }
    }
}

tasks.named('test', Test).configure {
    dependsOn prepareForgeCapabilityTests
    classpath = forgeTestRuntime
    useJUnitPlatform()
    // Native pose tests use the project-authored mathematical bind hierarchy.
}

// Java 17 on Windows reads launcher argument files in the system code page.
// An ASCII-path manifest JAR preserves UTF-8 project paths through URI encoding.
if (System.getProperty('os.name').startsWith('Windows') && projectDir.absolutePath.any { (int) it > 127 }) {
    def testClasspathJar = tasks.register('testClasspathJar', Jar) {
        dependsOn prepareForgeCapabilityTests, tasks.named('testClasses')
        inputs.files(forgeTestRuntime)
        archiveFileName = "blacklight-tests-${Integer.toUnsignedString(projectDir.absolutePath.hashCode())}.jar"
        destinationDirectory = file("${gradle.gradleUserHomeDir}/blacklight-test-classpaths")
        doFirst {
            manifest.attributes('Class-Path': forgeTestRuntime.files.collect {
                it.toURI().toASCIIString()
            }.join(' '))
        }
    }
    tasks.named('test', Test) {
        dependsOn testClasspathJar
        classpath = files(testClasspathJar)
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            geckolib_version       : geckolib_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
tasks.named('processResources') { dependsOn generateModMetadata }

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
// Current candidates have unresolved asset clearance/runtime readiness. Block
// both repository publishing and publishToMavenLocal until a reviewed public
// release profile is deliberately implemented; ordinary assemble still works.
tasks.withType(org.gradle.api.publish.maven.tasks.AbstractPublishToMaven).configureEach {
    doFirst {
        throw new GradleException("Publishing is disabled for ${releaseProfile}: current candidates are not cleared for public release.")
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs += ['-Xmaxerrs', '1000']
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// This source set deliberately has no Minecraft, NeoForge or Epic Fight dependency.
sourceSets {
    standaloneMotion {
        java {
            srcDirs = ['src/main/java', 'tools']
            include 'com/codex/blacklight/animation/MatrixMotionClip.java', 'com/codex/blacklight/util/MathCompat.java', 'StandaloneMotionProbe.java'
        }
    }
}
dependencies {
    standaloneMotionImplementation 'com.google.code.gson:gson:2.10.1'
    standaloneMotionImplementation 'org.joml:joml:1.10.5'
}
tasks.register('verifyStandaloneMotionAssets', JavaExec) {
    group = 'verification'
    description = 'Samples the supplied motion archive without the game or Epic Fight on the classpath.'
    dependsOn tasks.named('standaloneMotionClasses')
    classpath = sourceSets.standaloneMotion.runtimeClasspath
    mainClass = 'StandaloneMotionProbe'
    maxHeapSize = '1G'
    doFirst {
        def archive = providers.gradleProperty('motionProbeArchive')
        if (!archive.isPresent()) throw new GradleException('Supply -PmotionProbeArchive=<RC59 local-preview jar>')
        args = [archive.get()]
    }
}

tasks.register('verifyStandaloneBoundary') {
    group = 'verification'
    description = 'Rejects compiled references and runtime dependencies on Epic Fight or WoM.'
    dependsOn tasks.named('classes')
    doLast {
        def forbidden = configurations.runtimeClasspath.files.findAll {
            def name = it.name.toLowerCase(Locale.ROOT)
            name.contains('epic-fight') || name.contains('epicfight') || name.contains('weaponsofmiracles')
        }.collect { it.name }
        def linked = []
        sourceSets.main.output.classesDirs.files.each { root ->
            fileTree(root).matching { include '**/*.class' }.each { compiled ->
                def constants = new String(compiled.bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                if (constants.contains('yesman/epicfight') || constants.contains('reascer/wom'))
                    linked.add(root.toPath().relativize(compiled.toPath()).toString())
            }
        }
        if (!forbidden.empty || !linked.empty) {
            throw new GradleException("Not standalone: dependencies=${forbidden}; ${linked.size()} classes still reference old engines. See docs/STANDALONE_MIGRATION.md.")
        }
    }
}

// Every installable artifact must pass the independent runtime boundary.
tasks.named('jar') { dependsOn tasks.named('verifyStandaloneBoundary') }
tasks.named('jarJar') { dependsOn tasks.named('verifyStandaloneBoundary') }

// Forge runtime JARs must be reobfuscated before distribution.
tasks.named('jar') { finalizedBy 'reobfJar' }
tasks.named('jar') { archiveClassifier = "${releaseProfile}-slim" }
reobf { jarJar {} }
tasks.named('jarJar') { finalizedBy 'reobfJarJar' }
tasks.named('distributionZip') { dependsOn 'reobfJarJar' }
